<text x="711" y="571" fill="#172C40" font-size="17" font-weight="400" text-anchor="start">回调加深、重叠持续</text>
<text x="711" y="601" fill="#172C40" font-size="17" font-weight="400" text-anchor="start">两侧推进反复被收回</text>
