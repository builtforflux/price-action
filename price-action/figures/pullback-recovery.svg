<rect x="0" y="0" width="1120" height="1180" fill="#F7F9FC" stroke="none" rx="0"/>
<text x="32" y="45" fill="#172C40" font-size="26" font-weight="700" text-anchor="start">回调怎样改变控制权</text>
<text x="32" y="76" fill="#5C6B79" font-size="16" font-weight="400" text-anchor="start">同一多头回调 · 同一主要 HL 与原趋势极值 · 逐项增加证据</text>
