<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1180" viewBox="0 0 1120 1180" role="img" aria-labelledby="title desc">
<title id="title">回调怎样改变控制权</title><desc id="desc">三种候选后续共用多头通道与首次明显回调的已知走势。主要HL保持且顺势恢复支持恢复；持续双向收回支持平衡；反向突破主要HL并跟随、保留支持反向控制增强。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8A99A7"/></marker></defs>
