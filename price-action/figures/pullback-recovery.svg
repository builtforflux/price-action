<text x="711" y="261" fill="#172C40" font-size="17" font-weight="400" text-anchor="start">顺势实体与跟随增强</text>
<text x="711" y="319" fill="#087F78" font-size="16" font-weight="600" text-anchor="start">跟踪第二段、原趋势极值测试</text>
<text x="711" y="363" fill="#5C6B79" font-size="16" font-weight="400" text-anchor="start">原波段前提保持 → 持有</text>
