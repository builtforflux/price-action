<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="826" viewBox="0 0 1120 826" role="img" aria-labelledby="title desc">
<title id="title">行情走强与回吐风险</title><desc id="desc">成本为零的线性产品例子。首仓一单位入场100，止损96，原风险预算4、回吐额度4。上涨至104时整笔止损结果仍为负4，但当前回吐风险已增至8。减半仓位，或在新HL确认后把止损上移至100，均可把示例回吐风险降至4。</desc>
