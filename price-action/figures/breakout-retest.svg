<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="962" viewBox="0 0 1120 962" role="img" aria-labelledby="title desc">
<title id="title">突破后的两次检验</title><desc id="desc">上破后先检验突破进展；突破失败后在同一原突破区回测，受阻或收复产生不同路径。所有虚线均为候选后续。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8A99A7"/></marker></defs>
