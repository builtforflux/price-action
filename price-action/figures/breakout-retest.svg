<text x="347" y="333" fill="#087F78" font-size="15" font-weight="600" text-anchor="start">界外守住</text>
<line x1="429" y1="197" x2="455" y2="222" stroke="#087F78" stroke-width="1"/>
<text x="429" y="192" fill="#087F78" font-size="15" font-weight="600" text-anchor="start">顺势恢复</text>
