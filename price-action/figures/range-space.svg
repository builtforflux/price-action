<line x1="1035" y1="454" x2="1045" y2="454" stroke="#B44D32" stroke-width="2"/>
<text x="1025" y="387.0" fill="#B44D32" font-size="16" font-weight="700" text-anchor="end">止损 6</text>
<text x="592" y="510" fill="#172C40" font-size="21" font-weight="700" text-anchor="start">对侧距离 5 · 止损距离 6</text>
<text x="592" y="549" fill="#365DB4" font-size="17" font-weight="600" text-anchor="start">按现价重核目标、数量与剩余时间</text>
<text x="32" y="631" fill="#172C40" font-size="18" font-weight="600" text-anchor="start">参照保持，候选入场从 101 变为 105：对侧空间缩小，结构止损距离扩大。</text>
<text x="32" y="673" fill="#5C6B79" font-size="17" font-weight="400" text-anchor="start">入场核对：参与运动、持有前提、剩余目标、止损距离、数量、成本与期限。</text>
<text x="32" y="717" fill="#5C6B79" font-size="15" font-weight="400" text-anchor="start">图中线段表示价格距离；入场条件按所选参与方式验证。</text>
</svg>
