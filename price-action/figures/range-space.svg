<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="751" viewBox="0 0 1120 751" role="img" aria-labelledby="title desc">
<title id="title">区间位置与参与空间</title><desc id="desc">固定区间上沿110、下沿100和结构止损99，比较候选入场101与105至对侧和止损的价格距离。边界向内运动先测试中部，再评估对侧；当前价格变化后重新核对方案。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8A99A7"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif} .future{fill:none;stroke-width:3;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}.history{fill:none;stroke:#334A5F;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="1120" height="751" fill="#F7F9FC" stroke="none" rx="0"/>
